databaseChangeLog:
  - changeSet:
      id: 005-create-base-table-payment
      author: neilzendetorres
      changes:
        - createTable:
            tableName: payment
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(255)
              - column:
                  name: updated_by
                  type: VARCHAR(255)
              - column:
                  name: reservation_id
                  type: BIGINT
              - column:
                  name: amount
                  type: DECIMAL(19,2)
              - column:
                  name: status
                  type: VARCHAR(100)
        - addForeignKeyConstraint:
            baseTableName: payment
            baseColumnNames: reservation_id
            constraintName: fk_payment_reservation
            referencedTableName: reservation
            referencedColumnNames: id
